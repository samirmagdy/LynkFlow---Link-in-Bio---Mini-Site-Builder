    <script>
      // Resolve the appearance before first paint so a light-theme visitor never
      // sees a dark flash. Mirrors the storage key used by src/context/ThemeContext.tsx.
      (function () {
        try {
          var stored = window.localStorage.getItem('lynkflow:appearance');
          var appearance = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = appearance;
          document.documentElement.style.colorScheme = appearance;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
